<!DOCTYPE html>

    <body>
        <div class="row1">
             <div class="calc1">
                <h2>Формула Герона</h2>
                <label>Введіть a:</label>
                <input type="number" id="a">
                <br><br>
                <label>Введіть b:</label>
                <input type="number" id="b">
                <br><br>
                <label>Введіть c:</label>
                <input type="number" id="c">
                <br><br>
                <button onclick="calculateArea()">Розрахувати</button>
                <br><br>
                <label>Площа:</label>
                <input type="text" id="result" readonly>
            </div>
            <div class="calc2">
                <h2>Через дві сторони та кут</h2>
                <label>Введіть a:</label>
                <input type="number" id="a2">
                <br><br>
                <label>Введіть b:</label>
                <input type="number" id="b2">
                <br><br>
                <label>Введіть кут:</label>

                <br><br>

            </div>
            <div class="calc3">

        </div>
        <div class="row2">
            <div class="calc4">
                <h2>Через три сторони і радіус</h2>
                <label>Введіть a:</label>
                <input type="number" id="a4">
                <br><br>
                <label>Введіть b:</label>

                <br><br>
                <label>Введіть c:</label>
                <input type="number" id="c4">

                <button onclick="calculateArea4()">Розрахувати</button>
                <br><br>

            <div class="calc5">
                <h2>Перевірка на паліндром</h2>
                <label>Введіть число:</label>

            <div class="calc6">
                <h2>Перевірка на анаграму</h2>
                <label>Введіть перше слово:</label>
                <input type="text" id="a6">
